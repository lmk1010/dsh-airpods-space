<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="AirPods Space">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e36"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#4d6bfe"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <!-- two earbuds: round heads with tapered stems -->
  <g fill="url(#bud)">
    <path d="M92 64a26 26 0 0 0-5.5 51.4V180a11.5 11.5 0 0 0 23 0V91.5A26 26 0 0 0 92 64Z"/>
    <path d="M164 64a26 26 0 0 1 5.5 51.4V180a11.5 11.5 0 0 1-23 0V91.5A26 26 0 0 1 164 64Z"/>
  </g>
  <g fill="#1d2026">
    <circle cx="80" cy="86" r="5"/>
    <circle cx="176" cy="86" r="5"/>
  </g>
  <!-- voice waves between the buds -->
  <g fill="url(#wave)">
    <rect x="113" y="118" width="7" height="20" rx="3.5"/>
    <rect x="124.5" y="106" width="7" height="44" rx="3.5"/>
    <rect x="136" y="118" width="7" height="20" rx="3.5"/>
  </g>
</svg>
